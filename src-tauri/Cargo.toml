[package]
name = "gamefloat"
version = "0.1.0"
description = "GameFloat (游窗速播) - 游戏攻略悬浮窗"
authors = ["GameFloat"]
edition = "2021"
license = "MIT"
readme = "../README.md"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
